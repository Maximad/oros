name: Validate production files

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check deployment script
        run: bash -n deploy-live.sh

      - name: Guard final SATB configuration
        run: |
          grep -q "4 مسارات صوتية" choir-player-v2.js
          grep -q "name: 'سوبرانو'" choir-training-data.js
          grep -q "name: 'ألتو'" choir-training-data.js
          grep -q "name: 'تينور'" choir-training-data.js
          grep -q "name: 'باس'" choir-training-data.js
          ! grep -q "كاونتر تينور" choir-training-data.js
          ! grep -q "دوبل باس" choir-training-data.js
